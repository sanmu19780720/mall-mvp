name: backend-ci

# Quality gate: every PR targeting dev or main must pass `mvn test`.
# Tests run against in-memory H2 (see application-test.yml), so no MySQL is needed here.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: mvn -B -f backend/pom.xml test
